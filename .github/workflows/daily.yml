name: daily levels

# EMAs, 52-week extremes and PnF columns are DAILY values -- they cannot change
# intraday, so they are built once after the close and served all day. This is
# what lets the 1-minute job stay small enough to survive a 1-minute cadence.
on:
  schedule:
    # 10:15 UTC = 15:45 IST, after the NSE closing auction settles (Cat I
    # continuous ends 15:15, derivatives 15:40).
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-levels
  cancel-in-progress: false      # a half-written levels.json is worse than a late one

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                 # pandas+numpy+yfinance is ~20s uncached
          cache-dependency-path: requirements.txt

      - run: pip install -q -r requirements.txt

      # Refuses to emit a universe if NSE's index partition stops holding,
      # so a methodology change fails loudly instead of silently shipping a
      # list that is no longer ranks 251-750.
      - name: Rebuild universe from NSE constituents
        run: python scripts/build_universe.py

      - name: Build daily levels
        run: python scripts/daily_levels.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe.json data/levels.json data/pnf.json data/corp_actions.json
          git diff --staged --quiet || git commit -m "daily levels $(date -u +%F)"
          git push
