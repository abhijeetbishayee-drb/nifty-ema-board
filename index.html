<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMA Board — NSE 1–750</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c212b; --line:#252b37;
    --fg:#e6e9ef; --dim:#8b94a7; --accent:#4c8dff;
    --up:#2ebd85; --down:#f6465d; --warn:#f0b90b;
    --x:#2ebd85; --o:#f6465d;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
           --fg:#12151a; --dim:#5d6473; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 14px}
  .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:11.5px}
  .meta{margin-left:auto;color:var(--dim);font-size:11.5px;text-align:right}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--up);margin-right:5px;vertical-align:middle}
  .dot.warn{background:var(--warn)} .dot.bad{background:var(--down)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
  input,select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=search]{min-width:190px}
  /* Multi-pick filter. A native <select multiple> is a fixed-height list box
     that needs cmd-click to add a second value and gives no room for the 60+
     industries here, so this is a button plus a checkbox panel. */
  .pick{position:relative}
  .pick>button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 24px 5px 8px;font:inherit;font-size:12px;
    cursor:pointer;text-align:left;min-width:132px;position:relative}
  .pick>button::after{content:"";position:absolute;right:9px;top:50%;
    width:5px;height:5px;margin-top:-4px;border-right:1.5px solid var(--dim);
    border-bottom:1.5px solid var(--dim);transform:rotate(45deg)}
  .pick>button:hover{border-color:var(--dim)}
  .pick>button[aria-expanded="true"],.pick>button:focus-visible{border-color:var(--accent)}
  .pick.on>button{color:var(--accent);border-color:var(--accent)}
  .pick .menu{position:absolute;z-index:50;top:calc(100% + 4px);left:0;min-width:210px;
    max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px;box-shadow:0 10px 26px rgba(0,0,0,.55)}
  .pick .menu[hidden]{display:none}
  .pick .menu label{display:flex;align-items:center;gap:8px;padding:5px 8px;
    border-radius:5px;font-size:12px;cursor:pointer;white-space:nowrap}
  .pick .menu label:hover{background:var(--panel2)}
  .pick .menu input{accent-color:var(--accent);width:13px;height:13px;padding:0;margin:0}
  .pick .menu .clear{display:block;width:100%;background:none;border:0;color:var(--dim);
    font:inherit;font-size:11px;text-align:left;padding:5px 8px;cursor:pointer;
    border-bottom:1px solid var(--line);margin-bottom:3px}
  .pick .menu .clear:hover{color:var(--fg)}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--dim);border:0;padding:5px 10px;
    font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
  .ghost:hover{color:var(--fg);border-color:var(--accent)}
  .count{color:var(--dim);font-size:11.5px;margin-left:2px}

  .wrap{overflow:auto;height:calc(100vh - 104px)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:5px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;z-index:20;background:var(--panel2);
    font-weight:600;font-size:11.5px;color:var(--dim);cursor:pointer;
    text-align:right;user-select:none}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th:hover{color:var(--fg)}
  th .ar{opacity:.45;font-size:9px;margin-left:3px}
  td{text-align:right}
  td.l{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.stale{opacity:.45}
  .sym{font-weight:650}
  .sym a{color:inherit;text-decoration:none}
  .sym a:hover{color:var(--accent)}
  .nm{color:var(--dim);font-size:11px;max-width:200px;overflow:hidden;
    text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
  .tag{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);
    color:var(--dim)}
  .above{color:var(--up)} .below{color:var(--down)}
  .x{color:var(--x);font-weight:700} .o{color:var(--o);font-weight:700}
  .near{background:rgba(240,185,11,.13)}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  footer{padding:7px 14px;color:var(--dim);font-size:11px;
    border-top:1px solid var(--line);background:var(--panel)}

/* ── cross-board nav ─────────────────────────────────────────────────
   Six boards, one origin. Before this, clicking through to Rollover,
   PCR or 44 EMA was a dead end: the buttons vanished and the only way
   back was the browser's own Back.

   The arrow marks a link that LEAVES the app you are in, so it means the
   same thing on every board - here everything except this page is a
   different app, so everything except this page carries one. Colours are
   layered fallbacks because the three boards use three different variable
   names for the same four roles. */
.xnav{ display:flex; align-items:center; gap:4px; flex-wrap:wrap;
       margin:10px 0 2px; font-family:inherit; }
.xnav a{ font-size:12px; font-weight:600; letter-spacing:0.05em;
         text-transform:uppercase; text-decoration:none; padding:5px 10px;
         border-radius:5px; border:1px solid transparent;
         color:var(--text-dim, var(--dim, #8a8f9a)); opacity:0.82; }
.xnav a:hover{ color:var(--text, var(--fg, #e6e8ec)); opacity:1; }
.xnav a.here{ background:var(--panel, var(--card, #16181d));
              border-color:var(--border, var(--line, #24272e));
              color:var(--text, var(--fg, #e6e8ec)); opacity:1; }
.xnav a.away::after{ content:"\2197"; font-size:10px; margin-left:4px;
                     vertical-align:1px; opacity:0.7; }
.xnav a:focus-visible{ outline:2px solid var(--accent, #4c8dff); outline-offset:2px; }
.xnav-sep{ width:1px; align-self:stretch; margin:2px 6px; min-height:16px;
           background:var(--border, var(--line, #24272e)); opacity:0.8; }
@media (max-width:640px){ .xnav-sep{ display:none; } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>EMA Board</h1>
    <span class="sub">NSE ranks 1–750 · NIFTY Total Market</span>
    <span class="meta" id="meta">loading…</span>
  </div>
  <nav class="xnav">
    <a href="../nifty-heatmap-web/index.html" class="away">Nifty 50</a>
    <a href="../nifty-heatmap-web/sectors.html" class="away">F&amp;O Sectors</a>
    <a href="../nifty-heatmap-web/rrg.html" class="away">RRG</a>
    <span class="xnav-sep" aria-hidden="true"></span>
    <a href="../fno-rollover/" class="away">Rollover</a>
    <a href="../nifty-pcr-tracker/" class="away">PCR</a>
    <a href="../nifty-ema-board/" class="here" aria-current="page">44 EMA</a>
  </nav>
  <div class="filters">
    <input type="search" id="q" placeholder="Search symbol or name…" autocomplete="off">
    <div class="pick" id="band" data-all="All bands" data-unit="bands"></div>
    <div class="pick" id="ind" data-all="All industries" data-unit="industries"></div>
    <div class="seg" id="side">
      <button data-v="" class="on">Any</button>
      <button data-v="Above">Above 44</button>
      <button data-v="Below">Below 44</button>
    </div>
    <div class="seg" id="pnf">
      <button data-v="" class="on">Any</button>
      <button data-v="X">X demand</button>
      <button data-v="O">O supply</button>
    </div>
    <label class="count">|dist| ≤
      <input id="maxdist" type="number" step="0.5" min="0" placeholder="%" style="width:62px">
    </label>
    <label class="count" title="Boxes in the current PnF column: few = a fresh reversal, many = an extended run">boxes
      <input id="minbox" type="number" step="1" min="1" placeholder="min" style="width:58px">
      –
      <input id="maxbox" type="number" step="1" min="1" placeholder="max" style="width:58px">
    </label>
    <button class="ghost" id="reset">Reset</button>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="wrap">
  <table>
    <thead><tr id="hrow"></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No rows match these filters.</div>
</div>

<footer id="foot"></footer>

<script>
const COLS = [
  {k:'symbol',  t:'Symbol',   type:'s', cls:'l'},
  {k:'industry',t:'Industry', type:'s', cls:'l'},
  {k:'ltp',     t:'Spot',     type:'n'},
  {k:'ema44',   t:'44 EMA',   type:'n'},
  {k:'dist44',  t:'Dist %',   type:'n'},
  {k:'side',    t:'Side',     type:'s'},
  {k:'pnf',     t:'PnF Col',  type:'s'},
  {k:'pnf_boxes',t:'PnF Boxes',type:'n'},
  {k:'ema9',    t:'9',        type:'n'},
  {k:'ema14',   t:'14',       type:'n'},
  {k:'ema25',   t:'25',       type:'n'},
  {k:'ema50',   t:'50',       type:'n'},
  {k:'ema100',  t:'100',      type:'n'},
  {k:'ema200',  t:'200',      type:'n'},
  {k:'high52',  t:'52w High', type:'n'},
  {k:'d52h',    t:'% off H',  type:'n'},
  {k:'low52',   t:'52w Low',  type:'n'},
  {k:'d52l',    t:'% off L',  type:'n'},
];
let ROWS=[], sortK='dist44', sortAsc=true;
const $=id=>document.getElementById(id);
const num=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('en-IN',
  {minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>v==null||isNaN(v)?'—':(v>0?'+':'')+v.toFixed(2)+'%';

function header(){
  $('hrow').innerHTML = COLS.map(c=>
    `<th data-k="${c.k}" class="${c.cls||''}">${c.t}<span class="ar" data-ar="${c.k}"></span></th>`
  ).join('');
  $('hrow').querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortK===k) sortAsc=!sortAsc; else {sortK=k; sortAsc=(k==='dist44');}
    render();
  });
}

async function load(){
  const bust='?t='+Date.now();
  const [lv,sp] = await Promise.all([
    fetch('data/levels.json'+bust).then(r=>r.json()),
    fetch('data/spot.json'+bust).then(r=>r.json()).catch(()=>({rows:[],counts:{}}))
  ]);
  const spot = Object.fromEntries((sp.rows||[]).map(r=>[r.symbol,r]));
  ROWS = (lv.rows||[]).map(r=>{
    const s = spot[r.symbol]||{};
    const ltp = s.ltp ?? r.prev_close;
    const d44 = (ltp!=null && r.ema44) ? (ltp-r.ema44)/r.ema44*100 : null;
    return {...r, ltp,
      stale: !!s.stale,
      dist44: d44==null?null:+d44.toFixed(2),
      side: d44==null?null:(d44>=0?'Above':'Below'),
      d52h: (ltp!=null&&r.high52)?+(((ltp-r.high52)/r.high52)*100).toFixed(2):null,
      d52l: (ltp!=null&&r.low52)?+(((ltp-r.low52)/r.low52)*100).toFixed(2):null};
  });

  fillPick('ind', [...new Set(ROWS.map(r=>r.industry).filter(Boolean))].sort());

  // Bands are populated from the data, not hardcoded -- the list was hardcoded
  // to the two 251-750 bands and went stale the moment ranks 1-250 were added.
  // Ordered by market-cap rank, not alphabetically: a rank band read in the
  // order Microcap, Midcap, Nifty100, Smallcap is nonsense.
  const BAND_ORDER=['Nifty100','Midcap150','Smallcap250','Microcap250'];
  const bands=[...new Set(ROWS.map(r=>r.band).filter(Boolean))]
    .sort((a,b)=>{const x=BAND_ORDER.indexOf(a),y=BAND_ORDER.indexOf(b);
                  return (x<0?99:x)-(y<0?99:y)||String(a).localeCompare(b);});
  fillPick('band', bands);

  const fresh=sp.counts?.fresh??0, tot=sp.counts?.universe??ROWS.length;
  const bad = tot? (tot-fresh)/tot : 1;
  const cls = bad>0.5?'bad':(bad>0.05?'warn':'');
  $('meta').innerHTML=
    `<span class="dot ${cls}"></span>spot ${new Date(sp.generated_at||Date.now())
      .toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`+
    ` · ${fresh}/${tot} fresh · ${sp.fetch_path||'—'}`;
  $('foot').textContent =
    `Levels built ${lv.generated_at? new Date(lv.generated_at).toLocaleString('en-IN'):'—'}`+
    ` · ${lv.counts?.built??0}/${lv.counts?.universe??0} names · EMAs & 52w are daily values;`+
    ` Spot, Dist % and Side recompute live · PnF ${lv.pnf?.box_pct}% × ${lv.pnf?.reversal}`+
    ` (X = demand, O = supply) · auto-refresh 60s`;
  render();
}

function filtered(){
  const q=$('q').value.trim().toLowerCase();
  const b=SEL.band, i=SEL.ind;
  const sd=$('side').querySelector('.on').dataset.v;
  const pf=$('pnf').querySelector('.on').dataset.v;
  const md=parseFloat($('maxdist').value);
  const bmin=parseInt($('minbox').value,10), bmax=parseInt($('maxbox').value,10);
  return ROWS.filter(r=>{
    if(q && !(r.symbol.toLowerCase().includes(q) ||
             (r.name||'').toLowerCase().includes(q))) return false;
    // an empty set means "no filter", never "match nothing"
    if(b.size && !b.has(r.band)) return false;
    if(i.size && !i.has(r.industry)) return false;
    if(sd && r.side!==sd) return false;
    if(pf && r.pnf!==pf) return false;
    if(!isNaN(md) && (r.dist44==null || Math.abs(r.dist44)>md)) return false;
    // A null box count must not pass a numeric filter -- it is unknown, not small.
    if(!isNaN(bmin) && (r.pnf_boxes==null || r.pnf_boxes<bmin)) return false;
    if(!isNaN(bmax) && (r.pnf_boxes==null || r.pnf_boxes>bmax)) return false;
    return true;
  });
}

function render(){
  const col=COLS.find(c=>c.k===sortK)||COLS[4];
  const rows=filtered().sort((a,b)=>{
    let x=a[sortK], y=b[sortK];
    if(sortK==='dist44'){ x=x==null?Infinity:Math.abs(x); y=y==null?Infinity:Math.abs(y); }
    if(x==null) return 1; if(y==null) return -1;
    const c = col.type==='n' ? x-y : String(x).localeCompare(String(y));
    return sortAsc?c:-c;
  });
  document.querySelectorAll('[data-ar]').forEach(s=>s.textContent='');
  const ar=document.querySelector(`[data-ar="${sortK}"]`); if(ar) ar.textContent=sortAsc?'▲':'▼';

  $('count').textContent=`${rows.length} of ${ROWS.length}`;
  $('empty').hidden = rows.length>0;
  $('tb').innerHTML = rows.map(r=>`<tr class="${r.stale?'stale':''}">
    <td class="l"><span class="sym"><a href="https://www.nseindia.com/get-quotes/equity?symbol=${encodeURIComponent(r.symbol)}" target="_blank" rel="noopener">${r.symbol}</a></span>
      <span class="nm" title="${(r.name||'').replace(/"/g,'')}">${r.name||''}</span></td>
    <td class="l"><span class="tag">${r.industry||'—'}</span></td>
    <td>${num(r.ltp)}</td>
    <td>${num(r.ema44)}</td>
    <td class="${r.dist44==null?'':(r.dist44>=0?'above':'below')} ${r.dist44!=null&&Math.abs(r.dist44)<=1?'near':''}">${pct(r.dist44)}</td>
    <td class="${r.side==='Above'?'above':'below'}">${r.side||'—'}</td>
    <td class="${r.pnf==='X'?'x':'o'}">${r.pnf||'—'}</td>
    <td class="${r.pnf==='X'?'x':'o'}">${r.pnf_boxes==null?'—':r.pnf_boxes}</td>
    <td>${num(r.ema9)}</td><td>${num(r.ema14)}</td><td>${num(r.ema25)}</td>
    <td>${num(r.ema50)}</td><td>${num(r.ema100)}</td><td>${num(r.ema200)}</td>
    <td>${num(r.high52)}</td><td class="below">${pct(r.d52h)}</td>
    <td>${num(r.low52)}</td><td class="above">${pct(r.d52l)}</td>
  </tr>`).join('');
}

['q','maxdist','minbox','maxbox'].forEach(id=>$(id).oninput=render);

/* ── multi-pick filters ──────────────────────────────────────────────
   Bands and industries were single-value <select>s, so "Midcap150 AND
   Smallcap250" or "Pharma AND Hospitals" could not be asked at all - and
   a native <select multiple> is a fixed-height list box needing cmd-click,
   which is worse for 60-odd industries. A button plus a checkbox panel
   instead, with the selection held in a Set. */
const SEL={band:new Set(), ind:new Set()};

function fillPick(id, items){
  const box=$(id), sel=SEL[id];
  // drop anything the data no longer offers, so a stale pick cannot silently
  // filter every row away after the universe changes
  [...sel].forEach(v=>{ if(!items.includes(v)) sel.delete(v); });
  box.innerHTML =
    `<button type="button" aria-expanded="false" aria-haspopup="true"></button>`
    + `<div class="menu" hidden role="group" aria-label="${box.dataset.all}">`
    + `<button type="button" class="clear">Clear selection</button>`
    + items.map((v,n)=>`<label><input type="checkbox" value="${escAttr(v)}"`
        + `${sel.has(v)?' checked':''}><span>${escHtml(v)}</span></label>`).join('')
    + `</div>`;
  const btn=box.querySelector('button'), menu=box.querySelector('.menu');
  btn.onclick=e=>{ e.stopPropagation(); const open=menu.hidden;
    closePicks(); menu.hidden=!open; btn.setAttribute('aria-expanded', String(open)); };
  menu.onclick=e=>e.stopPropagation();
  menu.querySelector('.clear').onclick=()=>{
    sel.clear(); menu.querySelectorAll('input').forEach(c=>c.checked=false);
    labelPick(id); render(); };
  menu.querySelectorAll('input').forEach(c=>c.onchange=()=>{
    c.checked ? sel.add(c.value) : sel.delete(c.value);
    labelPick(id); render(); });
  labelPick(id);
}

function labelPick(id){
  const box=$(id), sel=SEL[id], btn=box.querySelector('button');
  btn.textContent = sel.size===0 ? box.dataset.all
    : sel.size===1 ? [...sel][0]
    : `${sel.size} ${box.dataset.unit}`;
  btn.title = sel.size ? [...sel].join(', ') : box.dataset.all;
  box.classList.toggle('on', sel.size>0);
}

function closePicks(){
  document.querySelectorAll('.pick .menu').forEach(m=>{ m.hidden=true;
    m.parentElement.querySelector('button').setAttribute('aria-expanded','false'); });
}
document.addEventListener('click', closePicks);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePicks(); });
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=t=>escHtml(t).replace(/"/g,'&quot;');
['side','pnf'].forEach(id=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render();
}));
$('reset').onclick=()=>{
  $('q').value=''; $('maxdist').value='';
  ['band','ind'].forEach(id=>{ SEL[id].clear();
    $(id).querySelectorAll('input').forEach(c=>c.checked=false); labelPick(id); });
  $('minbox').value=''; $('maxbox').value='';
  ['side','pnf'].forEach(id=>{
    $(id).querySelectorAll('button').forEach((x,n)=>x.classList.toggle('on',n===0));
  });
  sortK='dist44'; sortAsc=true; render();
};

header(); load();
setInterval(load, 60000);   // matches the 1-minute refresh cadence
</script>
</body>
</html>
