<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMA Board — NSE 1–750</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c212b; --line:#252b37;
    --fg:#e6e9ef; --dim:#8b94a7; --accent:#4c8dff;
    --up:#2ebd85; --down:#f6465d; --warn:#f0b90b;
    --x:#2ebd85; --o:#f6465d;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
           --fg:#12151a; --dim:#5d6473; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 14px}
  .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:11.5px}
  .meta{margin-left:auto;color:var(--dim);font-size:11.5px;text-align:right}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--up);margin-right:5px;vertical-align:middle}
  .dot.warn{background:var(--warn)} .dot.bad{background:var(--down)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
  input,select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=search]{min-width:190px}
  /* Multi-pick filter. A native <select multiple> is a fixed-height list box
     that needs cmd-click to add a second value and gives no room for the 60+
     industries here, so this is a button plus a checkbox panel. */
  .pick{position:relative}
  .pick>button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 24px 5px 8px;font:inherit;font-size:12px;
    cursor:pointer;text-align:left;min-width:132px;position:relative}
  .pick>button::after{content:"";position:absolute;right:9px;top:50%;
    width:5px;height:5px;margin-top:-4px;border-right:1.5px solid var(--dim);
    border-bottom:1.5px solid var(--dim);transform:rotate(45deg)}
  .pick>button:hover{border-color:var(--dim)}
  .pick>button[aria-expanded="true"],.pick>button:focus-visible{border-color:var(--accent)}
  .pick.on>button{color:var(--accent);border-color:var(--accent)}
  .pick .menu{position:absolute;z-index:50;top:calc(100% + 4px);left:0;min-width:210px;
    max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px;box-shadow:0 10px 26px rgba(0,0,0,.55)}
  .pick .menu[hidden]{display:none}
  .pick .menu label{display:flex;align-items:center;gap:8px;padding:5px 8px;
    border-radius:5px;font-size:12px;cursor:pointer;white-space:nowrap}
  .pick .menu label:hover{background:var(--panel2)}
  .pick .menu input{accent-color:var(--accent);width:13px;height:13px;padding:0;margin:0}
  .pick .menu .clear{display:block;width:100%;background:none;border:0;color:var(--dim);
    font:inherit;font-size:11px;text-align:left;padding:5px 8px;cursor:pointer;
    border-bottom:1px solid var(--line);margin-bottom:3px}
  .pick .menu .clear:hover{color:var(--fg)}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--dim);border:0;padding:5px 10px;
    font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
  .ghost:hover{color:var(--fg);border-color:var(--accent)}
  .count{color:var(--dim);font-size:11.5px;margin-left:2px}
  /* two X/O segs now sit side by side, so each needs a caption inline with
     it -- a bare <label> would push the <div class=seg> onto its own line */
  .segwrap{display:flex;align-items:center;gap:6px}

  .wrap{overflow:auto;height:calc(100vh - 104px)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:5px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;z-index:20;background:var(--panel2);
    font-weight:600;font-size:11.5px;color:var(--dim);cursor:pointer;
    text-align:right;user-select:none}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th:hover{color:var(--fg)}
  th .ar{opacity:.45;font-size:9px;margin-left:3px}
  td{text-align:right}
  td.l{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.stale{opacity:.45}
  /* A PnF cell opens the column it came from. pnf-charts and pnf-board are
     both private with Pages off, so there is nothing to link to - the grid is
     drawn here, from the same ported state machine that produced the number. */
  td.pnfcell{cursor:pointer}
  td.pnfcell:hover{text-decoration:underline;text-underline-offset:3px}
  #pnfwrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);
    display:flex;align-items:center;justify-content:center;padding:18px}
  #pnfwrap[hidden]{display:none}
  #pnfbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 24px 60px rgba(0,0,0,.6);max-width:min(980px,96vw);
    max-height:94vh;overflow:auto;padding:14px 16px 12px}
  #pnfchart svg{display:block;max-width:100%;height:auto}
  #pnfbox h3{margin:0;font-size:14px;display:flex;align-items:baseline;gap:9px}
  #pnfbox h3 .s{font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.03em}
  #pnfbox .scales{display:flex;gap:6px;margin:9px 0 4px}
  #pnfbox .scales button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:4px 9px;font:inherit;font-size:11px;cursor:pointer}
  #pnfbox .scales button.on{color:var(--fg);border-color:var(--accent)}
  #pnfclose{position:absolute;top:10px;right:12px;background:none;border:0;
    color:var(--dim);font-size:19px;line-height:1;cursor:pointer}
  #pnfclose:hover{color:var(--fg)}
  #pnfbox .foot{color:var(--dim);font-size:11px;margin-top:8px;max-width:62ch;line-height:1.5}
  .pnfgrid .gl{stroke:var(--line);stroke-width:.5;opacity:.55}
  .pnfgrid .xx{fill:none;stroke:var(--x);stroke-width:1.7}
  .pnfgrid .oo{fill:none;stroke:var(--o);stroke-width:1.7}
  .pnfgrid .bar{stroke-linecap:round}
  .pnfgrid .last{opacity:1}
  .pnfgrid .dim{opacity:.55}
  .pnfgrid text{fill:var(--dim);font-size:9px}
  .pnfgrid .ema{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3;opacity:.85}
  .pnfgrid .emalbl{fill:var(--accent);font-size:9px}
  .sym{font-weight:650}
  .sym a{color:inherit;text-decoration:none}
  .sym a:hover{color:var(--accent)}
  .nm{color:var(--dim);font-size:11px;max-width:200px;overflow:hidden;
    text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
  .tag{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);
    color:var(--dim)}
  .above{color:var(--up)} .below{color:var(--down)}
  .x{color:var(--x);font-weight:700} .o{color:var(--o);font-weight:700}
  .near{background:rgba(240,185,11,.13)}
  .dt{color:var(--dim);white-space:nowrap}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  footer{padding:7px 14px;color:var(--dim);font-size:11px;
    border-top:1px solid var(--line);background:var(--panel)}

/* ── cross-board nav ─────────────────────────────────────────────────
   Six boards, one origin. Before this, clicking through to Rollover,
   PCR or 44 EMA was a dead end: the buttons vanished and the only way
   back was the browser's own Back.

   The arrow marks a link that LEAVES the app you are in, so it means the
   same thing on every board - here everything except this page is a
   different app, so everything except this page carries one. Colours are
   layered fallbacks because the three boards use three different variable
   names for the same four roles. */
.xnav{ display:flex; align-items:center; gap:4px; flex-wrap:wrap;
       margin:10px 0 2px; font-family:inherit; }
.xnav a{ font-size:12px; font-weight:600; letter-spacing:0.05em;
         text-transform:uppercase; text-decoration:none; padding:5px 10px;
         border-radius:5px; border:1px solid transparent;
         color:var(--text-dim, var(--dim, #8a8f9a)); opacity:0.82; }
.xnav a:hover{ color:var(--text, var(--fg, #e6e8ec)); opacity:1; }
.xnav a.here{ background:var(--panel, var(--card, #16181d));
              border-color:var(--border, var(--line, #24272e));
              color:var(--text, var(--fg, #e6e8ec)); opacity:1; }
.xnav a.away::after{ content:"\2197"; font-size:10px; margin-left:4px;
                     vertical-align:1px; opacity:0.7; }
.xnav a:focus-visible{ outline:2px solid var(--accent, #4c8dff); outline-offset:2px; }
.xnav-sep{ width:1px; align-self:stretch; margin:2px 6px; min-height:16px;
           background:var(--border, var(--line, #24272e)); opacity:0.8; }
@media (max-width:640px){ .xnav-sep{ display:none; } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>EMA Board</h1>
    <span class="sub">NSE ranks 1–750 · NIFTY Total Market</span>
    <span class="meta" id="meta">loading…</span>
  </div>
  <nav class="xnav">
    <a href="../nifty-heatmap-web/index.html" class="away">Nifty 50</a>
    <a href="../nifty-heatmap-web/sectors.html" class="away">F&amp;O Sectors</a>
    <a href="../nifty-heatmap-web/rrg.html" class="away">RRG</a>
    <span class="xnav-sep" aria-hidden="true"></span>
    <a href="../fno-rollover/" class="away">Rollover</a>
    <a href="../nifty-pcr-tracker/" class="away">PCR</a>
    <a href="../nifty-ema-board/" class="here" aria-current="page">44 EMA</a>
  </nav>
  <div class="filters">
    <input type="search" id="q" placeholder="Search symbol or name…" autocomplete="off">
    <div class="pick" id="band" data-all="All bands" data-unit="bands"></div>
    <div class="pick" id="ind" data-all="All industries" data-unit="industries"></div>
    <div class="seg" id="side">
      <button data-v="" class="on">Any</button>
      <button data-v="Above">Above 44</button>
      <button data-v="Below">Below 44</button>
    </div>
    <span class="segwrap"><span class="count">PnF 0.25%</span>
      <div class="seg" id="pnf" title="Direction of the fast PnF column (0.75% reversal).">
        <button data-v="" class="on">Any</button>
        <button data-v="X">X demand</button>
        <button data-v="O">O supply</button>
      </div></span>
    <span class="segwrap"><span class="count">PnF 1%</span>
      <div class="seg" id="pnfm" title="Direction of the slow PnF column (3% reversal). This is the one that survives more than a bar or two.">
        <button data-v="" class="on">Any</button>
        <button data-v="X">X demand</button>
        <button data-v="O">O supply</button>
      </div></span>
    <label class="count">|dist| ≤
      <input id="maxdist" type="number" step="0.5" min="0" placeholder="%" style="width:62px">
    </label>
    <label class="count" title="Last session&#39;s close-to-close % change. Signed, so it reads as a range on the number line: max -3 keeps everything that fell 3% or more, min 2 keeps everything that rose 2% or more, -1 to 1 keeps the flat names.">chg %
      <input id="minchg" type="number" step="0.5" placeholder="min" style="width:58px">
      –
      <input id="maxchg" type="number" step="0.5" placeholder="max" style="width:58px">
    </label>
    <label class="count" title="Boxes in the current 0.25% PnF column: few = a fresh reversal, many = an extended run">PnF boxes 0.25%
      <input id="minbox" type="number" step="1" min="1" placeholder="min" style="width:58px">
      –
      <input id="maxbox" type="number" step="1" min="1" placeholder="max" style="width:58px">
    </label>
    <label class="count" title="Boxes in the current 1% PnF column. The scales are not comparable -- a box is 4x wider here, so the median is 7 against 25 on the 0.25% column.">PnF boxes 1%
      <input id="minboxm" type="number" step="1" min="1" placeholder="min" style="width:58px">
      –
      <input id="maxboxm" type="number" step="1" min="1" placeholder="max" style="width:58px">
    </label>
    <button class="ghost" id="reset">Reset</button>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="wrap">
  <table>
    <thead><tr id="hrow"></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No rows match these filters.</div>
</div>

<footer id="foot"></footer>

<div id="pnfwrap" hidden>
  <div id="pnfbox" style="position:relative">
    <button id="pnfclose" type="button" aria-label="Close">&times;</button>
    <h3><span id="pnfsym">—</span><span class="s" id="pnfmeta"></span></h3>
    <div class="scales" id="pnfscales">
      <button type="button" data-s="pnf">0.25% &times; 3</button>
      <button type="button" data-s="pnfm">1% &times; 3</button>
    </div>
    <div id="pnfchart"></div>
    <div class="foot" id="pnffoot"></div>
  </div>
</div>
<script>
const COLS = [
  {k:'symbol',  t:'Symbol',   type:'s', cls:'l'},
  {k:'industry',t:'Industry', type:'s', cls:'l'},
  {k:'ltp',     t:'Spot',     type:'n'},
  {k:'last_date',t:'Date',   type:'s', ttl:'Date of the last completed trading session -- the bar every daily figure on this row is built from'},
  {k:'chg_pct', t:'Chg %',   type:'n', ttl:'Close-to-close % change on that session. Not today\u2019s move.'},
  {k:'ema44',   t:'44 EMA',   type:'n'},
  {k:'dist44',  t:'Dist %',   type:'n'},
  {k:'side',    t:'Side',     type:'s'},
  {k:'pnf',     t:'PnF Col 0.25%', type:'s', ttl:'Reverses on 0.25% x 3 = a 0.75% move, which is inside a normal daily range: median column life is 2 bars and 48% last a single bar. Read it as a 1-2 day flag. CLICK a cell for the chart.'},
  {k:'pnf_boxes',t:'PnF Boxes 0.25%',type:'n', ttl:'Reverses on 0.25% x 3 = a 0.75% move, which is inside a normal daily range: median column life is 2 bars and 48% last a single bar. Read it as a 1-2 day flag. CLICK a cell for the chart.'},
  {k:'pnfm',    t:'PnF Col 1%',   type:'s', ttl:'Reverses on 1% x 3 = a 3% move (the pnf-charts medium preset). Same engine, slower scale -- this is the one to read as a leg rather than a wiggle. CLICK a cell for the chart.'},
  {k:'pnfm_boxes',t:'PnF Boxes 1%',type:'n', ttl:'Reverses on 1% x 3 = a 3% move (the pnf-charts medium preset). Same engine, slower scale -- this is the one to read as a leg rather than a wiggle. CLICK a cell for the chart.'},
  {k:'ema9',    t:'9',        type:'n'},
  {k:'ema14',   t:'14',       type:'n'},
  {k:'ema25',   t:'25',       type:'n'},
  {k:'ema50',   t:'50',       type:'n'},
  {k:'ema100',  t:'100',      type:'n'},
  {k:'ema200',  t:'200',      type:'n'},
  {k:'high52',  t:'52w High', type:'n'},
  {k:'d52h',    t:'% off H',  type:'n'},
  {k:'low52',   t:'52w Low',  type:'n'},
  {k:'d52l',    t:'% off L',  type:'n'},
];
let ROWS=[], sortK='dist44', sortAsc=true;
const $=id=>document.getElementById(id);
const num=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('en-IN',
  {minimumFractionDigits:2,maximumFractionDigits:2});
// ISO in the data (sorts correctly, unambiguous); "01 Oct" on screen, with the
// full date on hover -- the column repeats the same value on nearly every row,
// so it has to be narrow.
const dmy=v=>{ if(!v) return '\u2014';
  const d=new Date(v+'T00:00:00'); if(isNaN(d)) return v;
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); };
const pct=v=>v==null||isNaN(v)?'—':(v>0?'+':'')+v.toFixed(2)+'%';

function header(){
  $('hrow').innerHTML = COLS.map(c=>
    `<th data-k="${c.k}" class="${c.cls||''}"${c.ttl?` title="${c.ttl}"`:''}>${c.t}<span class="ar" data-ar="${c.k}"></span></th>`
  ).join('');
  $('hrow').querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortK===k) sortAsc=!sortAsc; else {sortK=k; sortAsc=(k==='dist44');}
    render();
  });
}

async function load(){
  const bust='?t='+Date.now();
  const [lv,sp] = await Promise.all([
    fetch('data/levels.json'+bust).then(r=>r.json()),
    fetch('data/spot.json'+bust).then(r=>r.json()).catch(()=>({rows:[],counts:{}}))
  ]);
  const spot = Object.fromEntries((sp.rows||[]).map(r=>[r.symbol,r]));
  ROWS = (lv.rows||[]).map(r=>{
    const s = spot[r.symbol]||{};
    const ltp = s.ltp ?? r.prev_close;
    const d44 = (ltp!=null && r.ema44) ? (ltp-r.ema44)/r.ema44*100 : null;
    return {...r, ltp,
      stale: !!s.stale,
      dist44: d44==null?null:+d44.toFixed(2),
      side: d44==null?null:(d44>=0?'Above':'Below'),
      d52h: (ltp!=null&&r.high52)?+(((ltp-r.high52)/r.high52)*100).toFixed(2):null,
      d52l: (ltp!=null&&r.low52)?+(((ltp-r.low52)/r.low52)*100).toFixed(2):null};
  });

  fillPick('ind', [...new Set(ROWS.map(r=>r.industry).filter(Boolean))].sort());

  // Bands are populated from the data, not hardcoded -- the list was hardcoded
  // to the two 251-750 bands and went stale the moment ranks 1-250 were added.
  // Ordered by market-cap rank, not alphabetically: a rank band read in the
  // order Microcap, Midcap, Nifty100, Smallcap is nonsense.
  const BAND_ORDER=['Nifty100','Midcap150','Smallcap250','Microcap250'];
  const bands=[...new Set(ROWS.map(r=>r.band).filter(Boolean))]
    .sort((a,b)=>{const x=BAND_ORDER.indexOf(a),y=BAND_ORDER.indexOf(b);
                  return (x<0?99:x)-(y<0?99:y)||String(a).localeCompare(b);});
  fillPick('band', bands);

  const fresh=sp.counts?.fresh??0, tot=sp.counts?.universe??ROWS.length;
  const bad = tot? (tot-fresh)/tot : 1;
  const cls = bad>0.5?'bad':(bad>0.05?'warn':'');
  $('meta').innerHTML=
    `<span class="dot ${cls}"></span>spot ${new Date(sp.generated_at||Date.now())
      .toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`+
    ` · ${fresh}/${tot} fresh · ${sp.fetch_path||'—'}`;
  $('foot').textContent =
    `Levels built ${lv.generated_at? new Date(lv.generated_at).toLocaleString('en-IN'):'—'}`+
    ` · ${lv.counts?.built??0}/${lv.counts?.universe??0} names · EMAs & 52w are daily values;`+
    ` Spot, Dist % and Side recompute live · PnF ${lv.pnf?.box_pct}% × ${lv.pnf?.reversal}`+
    ` (X = demand, O = supply) · auto-refresh 60s`;
  render();
}

function filtered(){
  const q=$('q').value.trim().toLowerCase();
  const b=SEL.band, i=SEL.ind;
  const sd=$('side').querySelector('.on').dataset.v;
  const pf=$('pnf').querySelector('.on').dataset.v;
  const pfm=$('pnfm').querySelector('.on').dataset.v;
  const md=parseFloat($('maxdist').value);
  const bmin=parseInt($('minbox').value,10), bmax=parseInt($('maxbox').value,10);
  const mmin=parseInt($('minboxm').value,10), mmax=parseInt($('maxboxm').value,10);
  // parseFloat, not parseInt -- and no Math.abs anywhere: chg % is signed, so
  // "min -3" means "down 3% or worse", not "moved 3% either way".
  const cmin=parseFloat($('minchg').value), cmax=parseFloat($('maxchg').value);
  return ROWS.filter(r=>{
    if(q && !(r.symbol.toLowerCase().includes(q) ||
             (r.name||'').toLowerCase().includes(q))) return false;
    // an empty set means "no filter", never "match nothing"
    if(b.size && !b.has(r.band)) return false;
    if(i.size && !i.has(r.industry)) return false;
    if(sd && r.side!==sd) return false;
    if(pf && r.pnf!==pf) return false;
    if(pfm && r.pnfm!==pfm) return false;
    if(!isNaN(md) && (r.dist44==null || Math.abs(r.dist44)>md)) return false;
    // A null box count must not pass a numeric filter -- it is unknown, not small.
    if(!isNaN(bmin) && (r.pnf_boxes==null || r.pnf_boxes<bmin)) return false;
    if(!isNaN(bmax) && (r.pnf_boxes==null || r.pnf_boxes>bmax)) return false;
    if(!isNaN(mmin) && (r.pnfm_boxes==null || r.pnfm_boxes<mmin)) return false;
    if(!isNaN(mmax) && (r.pnfm_boxes==null || r.pnfm_boxes>mmax)) return false;
    if(!isNaN(cmin) && (r.chg_pct==null || r.chg_pct<cmin)) return false;
    if(!isNaN(cmax) && (r.chg_pct==null || r.chg_pct>cmax)) return false;
    return true;
  });
}

function render(){
  const col=COLS.find(c=>c.k===sortK)||COLS[4];
  const rows=filtered().sort((a,b)=>{
    let x=a[sortK], y=b[sortK];
    if(sortK==='dist44'){ x=x==null?Infinity:Math.abs(x); y=y==null?Infinity:Math.abs(y); }
    if(x==null) return 1; if(y==null) return -1;
    const c = col.type==='n' ? x-y : String(x).localeCompare(String(y));
    return sortAsc?c:-c;
  });
  document.querySelectorAll('[data-ar]').forEach(s=>s.textContent='');
  const ar=document.querySelector(`[data-ar="${sortK}"]`); if(ar) ar.textContent=sortAsc?'▲':'▼';

  $('count').textContent=`${rows.length} of ${ROWS.length}`;
  $('empty').hidden = rows.length>0;
  $('tb').innerHTML = rows.map(r=>`<tr class="${r.stale?'stale':''}">
    <td class="l"><span class="sym"><a href="https://www.nseindia.com/get-quotes/equity?symbol=${encodeURIComponent(r.symbol)}" target="_blank" rel="noopener">${r.symbol}</a></span>
      <span class="nm" title="${(r.name||'').replace(/"/g,'')}">${r.name||''}</span></td>
    <td class="l"><span class="tag">${r.industry||'—'}</span></td>
    <td>${num(r.ltp)}</td>
    <td class="dt" title="${r.last_date||''}">${dmy(r.last_date)}</td>
    <td class="${r.chg_pct==null?'':(r.chg_pct>=0?'above':'below')}">${pct(r.chg_pct)}</td>
    <td>${num(r.ema44)}</td>
    <td class="${r.dist44==null?'':(r.dist44>=0?'above':'below')} ${r.dist44!=null&&Math.abs(r.dist44)<=1?'near':''}">${pct(r.dist44)}</td>
    <td class="${r.side==='Above'?'above':'below'}">${r.side||'—'}</td>
    <td class="${r.pnf==='X'?'x':'o'} pnfcell" data-sym="${r.symbol}" data-scale="pnf">${r.pnf||'—'}</td>
    <td class="${r.pnf==='X'?'x':'o'} pnfcell" data-sym="${r.symbol}" data-scale="pnf">${r.pnf_boxes==null?'—':r.pnf_boxes}</td>
    <td class="${r.pnfm==='X'?'x':'o'} pnfcell" data-sym="${r.symbol}" data-scale="pnfm">${r.pnfm||'—'}</td>
    <td class="${r.pnfm==='X'?'x':'o'} pnfcell" data-sym="${r.symbol}" data-scale="pnfm">${r.pnfm_boxes==null?'—':r.pnfm_boxes}</td>
    <td>${num(r.ema9)}</td><td>${num(r.ema14)}</td><td>${num(r.ema25)}</td>
    <td>${num(r.ema50)}</td><td>${num(r.ema100)}</td><td>${num(r.ema200)}</td>
    <td>${num(r.high52)}</td><td class="below">${pct(r.d52h)}</td>
    <td>${num(r.low52)}</td><td class="above">${pct(r.d52l)}</td>
  </tr>`).join('');
}

['q','maxdist','minbox','maxbox','minchg','maxchg','minboxm','maxboxm'].forEach(id=>$(id).oninput=render);

/* ── multi-pick filters ──────────────────────────────────────────────
   Bands and industries were single-value <select>s, so "Midcap150 AND
   Smallcap250" or "Pharma AND Hospitals" could not be asked at all - and
   a native <select multiple> is a fixed-height list box needing cmd-click,
   which is worse for 60-odd industries. A button plus a checkbox panel
   instead, with the selection held in a Set. */
const SEL={band:new Set(), ind:new Set()};

function fillPick(id, items){
  const box=$(id), sel=SEL[id];
  // drop anything the data no longer offers, so a stale pick cannot silently
  // filter every row away after the universe changes
  [...sel].forEach(v=>{ if(!items.includes(v)) sel.delete(v); });
  box.innerHTML =
    `<button type="button" aria-expanded="false" aria-haspopup="true"></button>`
    + `<div class="menu" hidden role="group" aria-label="${box.dataset.all}">`
    + `<button type="button" class="clear">Clear selection</button>`
    + items.map((v,n)=>`<label><input type="checkbox" value="${escAttr(v)}"`
        + `${sel.has(v)?' checked':''}><span>${escHtml(v)}</span></label>`).join('')
    + `</div>`;
  const btn=box.querySelector('button'), menu=box.querySelector('.menu');
  btn.onclick=e=>{ e.stopPropagation(); const open=menu.hidden;
    closePicks(); menu.hidden=!open; btn.setAttribute('aria-expanded', String(open)); };
  menu.onclick=e=>e.stopPropagation();
  menu.querySelector('.clear').onclick=()=>{
    sel.clear(); menu.querySelectorAll('input').forEach(c=>c.checked=false);
    labelPick(id); render(); };
  menu.querySelectorAll('input').forEach(c=>c.onchange=()=>{
    c.checked ? sel.add(c.value) : sel.delete(c.value);
    labelPick(id); render(); });
  labelPick(id);
}

function labelPick(id){
  const box=$(id), sel=SEL[id], btn=box.querySelector('button');
  btn.textContent = sel.size===0 ? box.dataset.all
    : sel.size===1 ? [...sel][0]
    : `${sel.size} ${box.dataset.unit}`;
  btn.title = sel.size ? [...sel].join(', ') : box.dataset.all;
  box.classList.toggle('on', sel.size>0);
}

function closePicks(){
  document.querySelectorAll('.pick .menu').forEach(m=>{ m.hidden=true;
    m.parentElement.querySelector('button').setAttribute('aria-expanded','false'); });
}
document.addEventListener('click', closePicks);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePicks(); });
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=t=>escHtml(t).replace(/"/g,'&quot;');
/* ── the PnF chart ───────────────────────────────────────────────────
   pnf-charts and pnf-board are PRIVATE and have Pages disabled, so there is
   no address to link a cell to. The grid is therefore drawn here, from the
   same ported state machine that produced the number in the cell - one
   engine, so the picture and the column can never disagree.

   data/pnf.json is a SEPARATE file fetched on the first chart opened, not
   part of levels.json: ~233 KB raw / ~91 KB gzip for both scales across 749
   names, which is worth paying once on demand and not at all on page load. */
let PNF=null, pnfLoading=null, pnfSym=null, pnfScale='pnf';

async function pnfData(){
  if(PNF) return PNF;
  if(!pnfLoading) pnfLoading = fetch('data/pnf.json?t='+Date.now())
    .then(r=>r.ok?r.json():null).then(d=>(PNF=d)).catch(()=>null);
  return pnfLoading;
}

// [dir_of_first(1=X,0=O), base_box, (bottom-base, height) x N] -> columns
function unpack(a){
  if(!a || a.length<4) return null;
  const out=[], base=a[1]; let d=a[0];
  for(let i=2;i+1<a.length;i+=2){
    const bottom=base+a[i], h=a[i+1];
    out.push({d, bottom, top:bottom+h-1});
    d = d?0:1;                       // columns strictly alternate
  }
  return out;
}

function drawPnf(){
  const host=$('pnfchart'), meta=$('pnfmeta'), foot=$('pnffoot');
  const rec = PNF && PNF.cols && PNF.cols[pnfSym];
  const cols = rec && unpack(rec[pnfScale]);
  const ps = PNF && PNF.presets && PNF.presets[pnfScale];
  $('pnfscales').querySelectorAll('button').forEach(b=>
    b.classList.toggle('on', b.dataset.s===pnfScale));
  if(!cols){
    host.innerHTML='<div style="color:var(--dim);font-size:12px;padding:22px 2px">'
      + (PNF ? 'No column data published for this name.' : 'Loading…') + '</div>';
    meta.textContent=''; foot.textContent=''; return;
  }
  // price of a box index, rebuilt from (base, pct) - never shipped as a price
  const pct=ps.box_pct, base=PNF.base||1;
  const price=i=>base*Math.pow(1+pct/100, i);

  let lo=Infinity, hi=-Infinity;
  cols.forEach(c=>{ lo=Math.min(lo,c.bottom); hi=Math.max(hi,c.top); });
  const rows=hi-lo+1, n=cols.length;

  /* FIT THE VIEWPORT, both ways. A 0.25% box over a run like SYRMA's
     1,490 -> 1,820 is ~90 rows; at a fixed 7px box that is a 630px grid in a
     panel that cannot show it, so the chart scrolled. The cell is now sized
     from the space actually available and the SAME value is used for width
     and height, because a PnF box is square - letting them diverge would
     distort the pattern the chart exists to show. */
  const padL=6, padR=58, padT=8, padB=16;
  const availW=Math.max(260, Math.min(760, (window.innerWidth||900)-180)) - padL - padR;
  /* 230 is measured, not guessed: title + scale buttons + caption + padding
     around the grid comes to ~180px, and the overlay adds 18px top and bottom. */
  const availH=Math.max(190, Math.min(640, (window.innerHeight||700)-230)) - padT - padB;
  /* The cell is FRACTIONAL, with only a hair of a floor. An integer floor of
     2px looks harmless until a name like INDIAGLYCO turns up: 692 boxes in the
     window, which at 2px is a 1,384px grid that overflows any screen. Scaling
     to fit has to mean fit. */
  const cell=Math.max(0.5, Math.min(17, Math.min(availW/n, availH/rows)));
  const cw=cell, ch=cell;
  /* Below ~5px an X or an O is a smudge. Rather than draw a smudge, each
     column becomes one bar over the same boxes: still the true column extent
     and direction, just without per-box glyphs, and the caption says so. */
  const glyphs = cell >= 5;
  const W=padL+n*cw+padR, H=padT+rows*ch+padB;
  const y=i=>padT+(hi-i)*ch;                 // high box at the top

  let g='';
  const gstep=ch>=5?1:Math.max(1,Math.ceil(5/ch));   // no hairline moire on tiny boxes
  for(let i=lo;i<=hi;i+=gstep){
    const yy=y(i)+ch/2;
    g+=`<line class="gl" x1="${padL}" y1="${yy.toFixed(1)}" x2="${padL+n*cw}" y2="${yy.toFixed(1)}"/>`;
  }
  // right-hand price axis, ~8 labels
  const step=Math.max(1, Math.round(rows/8));
  for(let i=lo;i<=hi;i+=step){
    const p=price(i);
    g+=`<text x="${padL+n*cw+6}" y="${(y(i)+ch/2+3).toFixed(1)}">`
      + `${p>=1000?Math.round(p).toLocaleString('en-IN'):p.toFixed(p<100?2:1)}</text>`;
  }
  cols.forEach((c,ci)=>{
    const x=padL+ci*cw, m=cell*0.34, cx=x+cw/2;
    const cls=(c.d? 'xx':'oo') + (ci===n-1?' last':' dim');
    if(!glyphs){
      const yTop=y(c.top)+ch*0.15, yBot=y(c.bottom)+ch*0.85;   // y() puts the HIGH box on top
      g += `<line class="${cls} bar" x1="${cx.toFixed(1)}" y1="${yTop.toFixed(1)}" `
         + `x2="${cx.toFixed(1)}" y2="${Math.max(yBot, yTop+1.5).toFixed(1)}" `
         + `stroke-width="${Math.max(1.4, cell*0.62).toFixed(1)}"/>`;
      return;
    }
    for(let i=c.bottom;i<=c.top;i++){
      const cy=y(i)+ch/2;
      g += c.d
        ? `<path class="${cls}" d="M${(cx-m).toFixed(1)} ${(cy-m).toFixed(1)}L${(cx+m).toFixed(1)} ${(cy+m).toFixed(1)}M${(cx+m).toFixed(1)} ${(cy-m).toFixed(1)}L${(cx-m).toFixed(1)} ${(cy+m).toFixed(1)}"/>`
        : `<circle class="${cls}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${m.toFixed(1)}"/>`;
    }
  });
  // the 44 EMA, so the chart answers the question the board is actually about
  const row=ROWS.find(r=>r.symbol===pnfSym);
  if(row && row.ema44>0){
    const b=Math.log(row.ema44/base)/Math.log(1+pct/100);
    if(b>=lo-1 && b<=hi+1){
      const yy=padT+(hi-b)*ch+ch/2;
      g+=`<line class="ema" x1="${padL}" y1="${yy.toFixed(1)}" x2="${padL+n*cw}" y2="${yy.toFixed(1)}"/>`
       + `<text class="emalbl" x="${padL+2}" y="${(yy-3).toFixed(1)}">44 EMA ${row.ema44}</text>`;
    }
  }
  host.innerHTML=`<svg class="pnfgrid" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
     aria-label="Point and figure chart for ${pnfSym}"><g>${g}</g></svg>`;
  const last=cols[n-1];
  meta.textContent=`${pct}% × ${ps.reversal} · last ${n} columns · ${rows} boxes`
    + (glyphs ? '' : ' · bars, too tall for glyphs');
  foot.innerHTML=`Current column <b class="${last.d?'x':'o'}">${last.d?'X — demand':'O — supply'}`
    + `</b>, ${last.top-last.bottom+1} boxes, `
    + `${price(last.bottom).toFixed(2)} to ${price(last.top+1).toFixed(2)}. `
    + `A box is ${pct}% of price and a reversal needs ${ps.reversal} boxes `
    + `(${(pct*ps.reversal).toFixed(2)}%), so time does not run evenly across the x axis — `
    + `each column is a move, not a day.`;
}

function openPnf(sym, scale){
  pnfSym=sym; pnfScale=scale||'pnf';
  $('pnfsym').textContent=sym;
  $('pnfwrap').hidden=false;
  drawPnf();
  pnfData().then(drawPnf);
}
function closePnf(){ $('pnfwrap').hidden=true; }

$('tb').addEventListener('click', e=>{
  const td=e.target.closest('td.pnfcell');
  if(td) openPnf(td.dataset.sym, td.dataset.scale);
});
$('pnfclose').onclick=closePnf;
$('pnfwrap').addEventListener('click', e=>{ if(e.target===$('pnfwrap')) closePnf(); });
$('pnfscales').querySelectorAll('button').forEach(b=>
  b.onclick=()=>{ pnfScale=b.dataset.s; drawPnf(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePnf(); });
window.addEventListener('resize', ()=>{ if(!$('pnfwrap').hidden) drawPnf(); });

['side','pnf','pnfm'].forEach(id=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render();
}));
$('reset').onclick=()=>{
  $('q').value=''; $('maxdist').value='';
  ['band','ind'].forEach(id=>{ SEL[id].clear();
    $(id).querySelectorAll('input').forEach(c=>c.checked=false); labelPick(id); });
  $('minbox').value=''; $('maxbox').value='';
  $('minboxm').value=''; $('maxboxm').value='';
  $('minchg').value=''; $('maxchg').value='';
  ['side','pnf','pnfm'].forEach(id=>{
    $(id).querySelectorAll('button').forEach((x,n)=>x.classList.toggle('on',n===0));
  });
  sortK='dist44'; sortAsc=true; render();
};

header(); load();
setInterval(load, 60000);   // matches the 1-minute refresh cadence
</script>
</body>
</html>
